name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Stamp the build number into the game
        run: sed -i "s/__BUILD__/${{ github.run_number }}/" www/index.html
      - name: Install tools
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Apply the app icon
        run: |
          if [ -f icons.zip ]; then unzip -o icons.zip -d android/app/src/main/res; fi
      - name: Copy game into Android project
        run: npx cap sync android
      - name: Set version number and fixed signing key
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          p = 'android/app/build.gradle'
          s = open(p).read()
          n = os.environ['RUN_NUMBER']
          s, c1 = re.subn(r'versionCode\s+\d+', 'versionCode ' + n, s, count=1)
          s, c2 = re.subn(r'versionName\s+"[^"]*"', 'versionName "1.1.' + n + '"', s, count=1)
          block = '''
              signingConfigs {
                  debug {
                      storeFile file("${rootProject.projectDir}/../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          '''
          s, c3 = re.subn(r'android\s*\{', lambda m: m.group(0) + block, s, count=1)
          if not (c1 and c2 and c3):
              sys.exit('Could not patch build.gradle: ' + str((c1, c2, c3)))
          open(p, 'w').write(s)
          PY
          grep -n "versionCode\|versionName\|storeFile" android/app/build.gradle
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Show signing fingerprint (must be the same in every build)
        run: |
          echo "Key file in the repository:"
          keytool -list -keystore debug.keystore -storepass android | grep -i fingerprint || true
          echo "Key inside the built APK:"
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -i sha256 || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (permanent download link)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Sudoku.apk
          TAG="build-$RUN_NUMBER"
          NOTES=$(printf 'Automatic build %s.\n\n%s' "$RUN_NUMBER" "${COMMIT_MSG:-Started manually}")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Sudoku.apk --clobber
          else
            gh release create "$TAG" Sudoku.apk --target "$GITHUB_SHA" --title "Sudoku build $RUN_NUMBER" --notes "$NOTES" --latest
          fi
